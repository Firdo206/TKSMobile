name: aplikasi_olahragasiswa
description: "Aplikasi Stopwatch Guru Olahraga"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-tks-white.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"